providers:
  vercel_ai_gateway:
    enabled: true
    # model: openai/gpt-5-mini
    model: openai/gpt-5.1-codex
    configured: true
GOOSE_TELEMETRY_ENABLED: false
GOOSE_THINKING_EFFORT: medium
active_provider: vercel_ai_gateway

# Skills are discovered from ~/.agents/skills/ — the extension must be enabled
# for `goose skills list` to find them.
extensions:
  developer:
    enabled: true
    name: developer
    type: builtin
  skills:
    enabled: true
    name: skills
    type: builtin
