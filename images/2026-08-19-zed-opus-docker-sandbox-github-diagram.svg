<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Zed and Opus as orchestrator, dispatching to subagents in isolated Docker Sandboxes, each pushing to GitHub</title>
<desc>A diagram showing Julie working in Zed IDE with Opus as the architect and driver, which dispatches tasks to multiple subagents, each running in its own isolated Docker Sandbox microVM. Each subagent pushes its changes to GitHub, and Julie separately reviews on GitHub.com via a right-angled path that routes around the sandbox container.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<!-- You -->
<g>
<rect x="30" y="36" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">You</text>
</g>
<line x1="150" y1="58" x2="188" y2="58" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Orchestrator container: Zed + Opus -->
<g>
<rect x="190" y="20" width="300" height="90" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="210" y="42" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Zed IDE (devcontainer)</text>
<text x="210" y="60" font-family="sans-serif" font-size="12" fill="#3C3489">Opus — architect / driver</text>
<text x="210" y="78" font-family="sans-serif" font-size="12" fill="#3C3489">Plans features, writes tasks</text>
</g>

<!-- Plan artifact -->
<line x1="340" y1="110" x2="340" y2="150" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="250" y="152" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Plan (markdown file)</text>
</g>

<!-- Dispatch arrows fanning to sandbox tier -->
<line x1="280" y1="192" x2="150" y2="240" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="192" x2="330" y2="240" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="192" x2="510" y2="240" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Docker Sandboxes outer container -->
<g>
<rect x="30" y="242" width="620" height="150" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="50" y="264" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Docker Sandboxes</text>
<text x="50" y="282" font-family="sans-serif" font-size="12" fill="#085041">Each subagent = isolated microVM, own kernel + daemon</text>
</g>

<!-- Subagent 1 -->
<g>
<rect x="50" y="300" width="160" height="72" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="130" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Subagent A</text>
<text x="130" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">sbx run claude</text>
<text x="130" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Sonnet, task-scoped</text>
</g>

<!-- Subagent 2 -->
<g>
<rect x="250" y="300" width="160" height="72" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Subagent B</text>
<text x="330" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">sbx run claude</text>
<text x="330" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Sonnet, task-scoped</text>
</g>

<!-- Subagent 3 -->
<g>
<rect x="450" y="300" width="160" height="72" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="530" y="324" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Subagent C</text>
<text x="530" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">sbx run claude</text>
<text x="530" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Sonnet, task-scoped</text>
</g>

<!-- Push arrows from each subagent down to GitHub -->
<line x1="130" y1="372" x2="300" y2="440" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="372" x2="330" y2="440" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="372" x2="360" y2="440" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">push (bot account)</text>

<!-- GitHub.com container, centered -->
<g>
<rect x="220" y="442" width="240" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">github.com</text>
<text x="340" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">Pull requests</text>
</g>

<!-- You -> GitHub review path, two right angles routed around the left edge of Docker Sandboxes -->
<path d="M15 80 L15 472 L218 472" fill="none" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="15" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441" transform="rotate(-90 15 270)">review</text>

</svg>
