<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <!-- Docker Sandbox — solid boundary -->
  <rect x="20" y="20" width="260" height="220" rx="8"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#0F162B">🐳 Docker Sandbox</text>
  <text x="40" y="66" font-size="11" fill="#61738D">microVM — hypervisor boundary</text>

  <!-- goose — not a boundary -->
  <rect x="50" y="84" width="200" height="132" rx="6"
        fill="none" stroke="#61738D" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="70" y="110" font-size="14" font-weight="600" fill="#0F162B">🪿 goose</text>
  <text x="70" y="128" font-size="11" fill="#61738D">open-source agent runtime</text>

  <!-- LLM — not a boundary -->
  <rect x="80" y="142" width="140" height="58" rx="6"
        fill="none" stroke="#61738D" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="100" y="166" font-size="14" font-weight="600" fill="#0F162B">🧠 LLM</text>
  <text x="100" y="184" font-size="11" fill="#61738D">model-agnostic</text>

</svg>
