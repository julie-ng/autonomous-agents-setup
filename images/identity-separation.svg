<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <!-- ============ HOST ============ -->
  <rect x="120" y="20" width="420" height="170" rx="8"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="140" y="45" font-size="14" font-weight="600" fill="#6b7280">💻 Host</text>

  <!-- Sandbox (left half, solid grey) -->
  <rect x="145" y="60" width="175" height="108" rx="6"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="163" y="82" font-size="12" font-weight="600" fill="#6b7280">🐳 Sandbox</text>

  <!-- agent nested inside sandbox — green -->
  <rect x="160" y="94" width="145" height="60" rx="6"
        fill="#f4fce8" stroke="#7cb342" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="174" y="114" font-size="12" font-weight="600" fill="#7cb342">🪿 Agent</text>
  <rect x="174" y="122" width="118" height="24" rx="4"
        fill="#ffffff" stroke="#7cb342" stroke-width="1"/>
  <text x="184" y="138" font-size="10" fill="#7a8a6f">🔑 SSH key (private)</text>

  <!-- me (right half) — blue -->
  <rect x="345" y="60" width="175" height="108" rx="6"
        fill="#e8f1fd" stroke="#4a90e2" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="363" y="84" font-size="13" font-weight="600" fill="#2f6cb5">👤 Me</text>
  <text x="363" y="101" font-size="10" fill="#7a8ba3">julie-ng</text>

  <!-- GPG private key — outside the host box, right -->
  <rect x="565" y="88" width="130" height="52" rx="6"
        fill="#e8f1fd" stroke="#4a90e2" stroke-width="1" />
  <text x="581" y="110" font-size="10" font-weight="600" fill="#2f6cb5">🔐 GPG key</text>
  <text x="581" y="126" font-size="10" fill="#7a8ba3">(private) – on YubiKey</text>
  <path d="M 520 114 L 565 114" fill="none" stroke="#4a90e2" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- agent → me : blocked -->
  <path d="M 320 140 L 337 140" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 337 133 L 349 147 M 337 147 L 349 133" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="333" y="182" font-size="10" fill="#dc2626" text-anchor="middle">cannot impersonate</text>

  <!-- ============ GITHUB ============ -->
  <rect x="120" y="240" width="420" height="160" rx="8"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="140" y="266" font-size="14" font-weight="600" fill="#6b7280">🐙 github.com</text>

  <!-- agent account — green, left -->
  <rect x="145" y="282" width="175" height="98" rx="6"
        fill="#f4fce8" stroke="#7cb342" stroke-width="1"/>
  <text x="163" y="304" font-size="12" font-weight="600" fill="#7cb342">🪿 Agent account</text>
  <rect x="163" y="314" width="139" height="24" rx="4"
        fill="#ffffff" stroke="#7cb342" stroke-width="1"/>
  <text x="173" y="330" font-size="10" fill="#7a8a6f">🔑 SSH key (public)</text>

  <!-- my account — blue, right -->
  <rect x="345" y="282" width="175" height="98" rx="6"
        fill="#e8f1fd" stroke="#4a90e2" stroke-width="1" />
  <text x="363" y="304" font-size="12" font-weight="600" fill="#2f6cb5">👤 My account</text>
  <rect x="363" y="314" width="139" height="24" rx="4"
        fill="#ffffff" stroke="#4a90e2" stroke-width="1"/>
  <text x="373" y="330" font-size="10" fill="#7a8ba3">PAT</text>
  <rect x="363" y="344" width="139" height="24" rx="4"
        fill="#ffffff" stroke="#4a90e2" stroke-width="1"/>
  <text x="373" y="360" font-size="10" fill="#7a8ba3">🔐 GPG key (public)</text>

  <!-- agent → github : SSH -->
  <path d="M 232 154 L 232 282" fill="none" stroke="#7cb342" stroke-width="1.5"
        marker-end="url(#arrowgreen)"/>
  <text x="240" y="228" font-size="10" fill="#7cb342">SSH</text>

  <!-- me → github : PAT -->
  <path d="M 432 168 L 432 282" fill="none" stroke="#4a90e2" stroke-width="1.5"
        marker-end="url(#arrowblue)"/>
  <text x="440" y="228" font-size="10" fill="#2f6cb5">PAT</text>

  <defs>
    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7cb342"/>
    </marker>
  </defs>

</svg>
