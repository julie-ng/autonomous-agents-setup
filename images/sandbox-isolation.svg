<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

  <!-- Host — outer -->
  <rect x="20" y="20" width="420" height="260" rx="8"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="46" font-size="14" font-weight="600" fill="#6b7280">💻 Host</text>

  <!-- Credentials — full width -->
  <rect x="50" y="62" width="360" height="52" rx="6"
        fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="70" y="86" font-size="13" font-weight="600" fill="#9ca3af">🔑 Credentials</text>
  <text x="70" y="103" font-size="11" fill="#9ca3af">~/.ssh, ~/.aws/credentials</text>

  <!-- coding-agent A — unsandboxed, left half -->
  <rect x="50" y="196" width="165" height="58" rx="6"
        fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="68" y="220" font-size="13" font-weight="600" fill="#9ca3af">🤖 coding-agent A</text>
  <text x="68" y="237" font-size="11" fill="#9ca3af">no boundary</text>

  <!-- Sandbox — solid, right half -->
  <rect x="245" y="166" width="165" height="98" rx="6"
        fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="263" y="188" font-size="13" font-weight="600" fill="#6b7280">🐳 Sandbox</text>

  <!-- coding-agent B — inside sandbox -->
  <rect x="263" y="200" width="129" height="48" rx="6"
        fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="277" y="222" font-size="12" font-weight="600" fill="#9ca3af">🤖 coding-agent B</text>
  <text x="277" y="238" font-size="10" fill="#9ca3af">isolated</text>

  <!-- A → Credentials : solid, reaches -->
  <path d="M 110 196 L 110 114" fill="none" stroke="#7cb342" stroke-width="1.5"
        marker-end="url(#arrowgreen)"/>
  <text x="120" y="158" font-size="15" fill="#7cb342">✔</text>

  <!-- B → Credentials : dashed, stops at sandbox wall -->
  <path d="M 330 200 L 330 168" fill="none" stroke="#dc2626" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <!-- collision at boundary -->
  <path d="M 322 160 L 338 152 M 322 152 L 338 160" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="346" y="162" font-size="15" fill="#dc2626">✕</text>
  <text x="300" y="140" font-size="10" fill="#dc2626" text-anchor="middle">blocked at boundary</text>

  <defs>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7cb342"/>
    </marker>
  </defs>

</svg>
